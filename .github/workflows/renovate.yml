# Renovate, self-hosted: updates the dependencies .github/renovate.json5 names
# and opens a PR for each; CI runs on it, and the updates that config lets merge
# on their own merge through GitHub auto-merge once CI passes (CONTRIBUTING.md
# "Dependency updates").
#
# It runs as a GitHub App, because pushes made with the workflow's own token
# start no workflows (CI would never run on Renovate's branches) and cannot
# change .github/workflows/. The app's token goes to Renovate only; the
# post-upgrade script gets this workflow's read-only token.
name: Renovate

on:
  # Tuesdays and Fridays at 16:17 UTC, Saturdays and Sundays at 07:17 UTC: the
  # only schedule, since renovate.json5 has none. GitHub may start a run late or
  # skip it (hence a minute off the hour, which it delays less); Renovate does
  # its work whenever it runs.
  schedule:
    - cron: '17 16 * * 2,5'
    - cron: '17 7 * * 0,6'
  workflow_dispatch:

permissions:
  contents: read
  # gh attestation verify in the post-upgrade script (OfficeAgent).
  attestations: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RENOVATE_VERSION: 44.224.2
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.RENOVATE_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
      # Commits are authored by the app's bot account, which has its own user id.
      - name: Find the app's bot account
        id: bot
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: echo "id=$(gh api "/users/$SLUG%5Bbot%5D" --jq .id)" >>"$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Run Renovate
        env:
          RENOVATE_TOKEN: ${{ steps.app.outputs.token }}
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: '["${{ github.repository }}"]'
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_GIT_AUTHOR: ${{ steps.app.outputs.app-slug }}[bot] <${{ steps.bot.outputs.id }}+${{ steps.app.outputs.app-slug }}[bot]@users.noreply.github.com>
          RENOVATE_ALLOWED_COMMANDS: '["^scripts/renovate-post-upgrade\\.sh (shellcheck|code-server|officeagent|pipelock|doc-tools-lock)$"]'
          # gh in the post-upgrade script reads public releases and attestations.
          RENOVATE_CUSTOM_ENV_VARIABLES: '{"GH_TOKEN": "${{ github.token }}"}'
          LOG_LEVEL: info
        run: npx --yes "renovate@$RENOVATE_VERSION"
