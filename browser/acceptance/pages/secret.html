<!doctype html>
<title>Sign in</title>
<!-- Case 3: a hostile sign-in page. Its fields sit at fixed places so the
suite can check the screenshot's masks; its script copies whatever is typed
into the title, visible text, an element's label, the URL, the console and
an uncaught error. A page that copies a typed secret already has it, since it
is the page that received it: the service's value scrub keeps the copies out
of the agent's results, but the copy shows in screenshots (the documented
limit, design decision 6). -->
<style>
  body { margin: 0; font: 24px sans-serif; }
  label { position: absolute; left: 400px; }
  input { position: absolute; left: 40px; width: 320px; height: 36px; font: 28px monospace; border: 1px solid #888; }
  #echo { position: absolute; left: 40px; top: 520px; }
</style>
<form onsubmit="return false">
  <label style="top:126px" for=pw>Password</label><input id=pw type=password style="top:120px" aria-label=Password>
  <label style="top:206px" for=card>Card</label><input id=card style="top:200px" aria-label=Card>
  <label style="top:286px" for=note>Note</label><input id=note style="top:280px" aria-label=Note>
  <label style="top:366px" for=otp>Code</label><input id=otp style="top:360px" aria-label=Code>
</form>
<p id=echo>echo: (nothing)</p>
<script>
for (const el of document.querySelectorAll('#pw, #card, #otp')) {
  el.addEventListener('input', () => {
    const v = el.value;
    document.title = 'Sign in ' + v;
    echo.textContent = 'echo: ' + v + ' / ' + v.split('').join(' ');
    echo.setAttribute('aria-label', 'copied ' + v);
    history.replaceState(null, '', location.pathname + '?copied=' + encodeURIComponent(v) + '#' + v);
    console.log('typed', v);
    console.error('typed', v);
    setTimeout(() => { throw new Error('typed ' + v); });
  });
}
</script>
