<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="csrf" content="{{ csrf }}">
  <meta name="vapid" content="{{ vapid_public_key }}">
  <meta name="base" content="{{ base }}">
  <meta name="theme-color" content="#e7eaf0">
  <meta name="color-scheme" content="light">
  <title>{% block title %}Browser{% endblock %} - Lollo Rozzo</title>
  <!-- use-credentials: the manifest fetch must carry the Access cookie. -->
  <link rel="manifest" href="{{ base }}/manifest.webmanifest" crossorigin="use-credentials">
  <link rel="icon" href="{{ base }}/icon-192.png">
  <link rel="apple-touch-icon" href="{{ base }}/icon-192.png">
  <link rel="stylesheet" href="{{ base }}/lollo.css">
  <link rel="stylesheet" href="{{ base }}/app.css">
  <script src="{{ base }}/app.js" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <img class="app-icon" src="{{ base }}/icon-192.png" width="28" height="28" alt="">
      <a class="title" href="{{ base }}/">Browser</a>
      <a class="topbar-note" href="/">Lollo Rozzo</a>
    </div>
    {% if email %}
    <nav class="tabs">
      <a href="{{ base }}/">Tasks{% if pending_count %} <span class="badge">{{ pending_count }}</span>{% endif %}</a>
      <a href="{{ base }}/live">Live view</a>
      <a href="{{ base }}/sites">Sites</a>
      <a href="{{ base }}/audit">History</a>
      <a href="{{ base }}/notifications">Notifications</a>
    </nav>
    {% endif %}
  </header>
  <main class="shell{% block shell_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  {% if email %}<footer class="footer">Signed in as {{ email }}</footer>{% endif %}
</body>
</html>
